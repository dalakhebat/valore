# Project Xcode di-generate dari file ini: `xcodegen generate`.
# Valore.xcodeproj tidak di-commit; ubah setelan di sini, bukan di Xcode.
name: Valore
options:
  bundleIdPrefix: com.ikhwansufi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: id

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Valore:
    type: application
    platform: iOS
    sources:
      - path: Valore
    configFiles:
      Debug: Config/Valore.xcconfig
      Release: Config/Valore.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikhwansufi.valore
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VALORE
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ValoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ValoreTests
    dependencies:
      - target: Valore
    configFiles:
      Debug: Config/Valore.xcconfig
      Release: Config/Valore.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikhwansufi.valore.tests
        GENERATE_INFOPLIST_FILE: YES

  ValoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ValoreUITests
    dependencies:
      - target: Valore
    configFiles:
      Debug: Config/Valore.xcconfig
      Release: Config/Valore.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikhwansufi.valore.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Valore

schemes:
  Valore:
    build:
      targets:
        Valore: all
        ValoreTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-sampleData": false
    test:
      config: Debug
      targets:
        - ValoreTests

  # Ambil screenshot README (lampiran di hasil tes). Dipisah supaya ⌘U tetap cepat.
  Screenshots:
    build:
      targets:
        Valore: all
        ValoreUITests: [test]
    test:
      config: Debug
      targets:
        - ValoreUITests
